<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Effestudio HUB">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Effestudio HUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#ececea; --fg:#141414; --muted:#5f5f5c; --line:#dcdcd8;
  --accent:#141414; --accent-fg:#ffffff; --crit:#b3261e; --crit-soft:#f8dcd9; --ok:#1f7a45; --ok-soft:#dcf0e3;
  --bar:#141414; --bar-fg:#ffffff;
  --display:"Montserrat","Arial",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --r:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0e0e; --surface:#191919; --surface-2:#232323; --fg:#f2f2f0; --muted:#a3a3a0; --line:#2e2e2e;
  --accent:#f2f2f0; --accent-fg:#141414; --crit:#f07a70; --crit-soft:#3d1d1a; --ok:#5cc489; --ok-soft:#15301f;
  --bar:#000000; --bar-fg:#f2f2f0; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home */
#home{min-height:100%;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:48px;height:48px;border-radius:12px}
h1,h2{font-family:var(--display);margin:0}
h1{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:13px}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;min-height:132px;position:relative}
.tile:hover{border-color:var(--fg)}
.tile:active{transform:scale(.98)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-family:var(--display);font-size:15px;font-weight:700;line-height:1.2}
.tile span{color:var(--muted);font-size:13px;line-height:1.3}
.tile .ext{position:absolute;top:12px;right:12px;font-size:12px;color:var(--muted);font-weight:600}
.admin-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lnk{background:none;border:1px solid var(--line);border-radius:var(--r);padding:9px 14px;font-weight:600;cursor:pointer;background:var(--surface)}
.muted{color:var(--muted);font-size:13px}
/* aggiornamenti */
.upd{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--fg);border-radius:var(--r);padding:12px 14px}
.upd b{font-family:var(--display);font-size:15px;display:block}
.upd span{color:var(--muted);font-size:13px}
.upd .primary{flex:none;padding:10px 16px}
.tile .dot{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--accent-fg);text-transform:uppercase;letter-spacing:.04em}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);text-transform:uppercase;letter-spacing:.04em}

/* app aperta */
#shell{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:6px;background:var(--bar);color:var(--bar-fg);padding:calc(6px + env(safe-area-inset-top)) 8px 6px;min-height:48px}
.topbar button{background:transparent;border:0;color:inherit;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:6px}
.topbar button:hover{background:rgba(255,255,255,.1)}
.topbar .t{flex:1;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar svg{width:20px;height:20px}
#frames{flex:1;position:relative}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);pointer-events:none}

dialog{border:0;border-radius:14px;padding:0;width:min(380px,92vw);background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-family:var(--display);margin:0;font-size:18px}
.dlg input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:18px;width:100%}
.dlg .row{display:flex;gap:8px}.dlg .row button{flex:1}
.primary{background:var(--accent);color:var(--accent-fg);border:1px solid var(--accent);border-radius:8px;padding:11px;font-weight:700;cursor:pointer}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px;font-weight:600;cursor:pointer}
.err{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:10px;font-weight:600;font-size:14px}

/* fluidità touch (Android/iOS) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
button,a,select,label,summary,[role=button]{touch-action:manipulation}
button:not(:disabled):active{opacity:.75}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
img{max-width:100%}
</style>
</head>
<body>

<div id="home">
  <div class="wrap">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Effestudio HUB</h1><small>Tutte le app Effestudio in un posto</small></div></div>
    <div class="upd" id="upd" hidden><div><b id="upd-t">Aggiornamenti disponibili</b><span id="upd-s"></span></div><button class="primary" id="b-upd">Aggiorna</button></div>
    <section><h2>Staff</h2><div class="grid" id="g-staff"></div></section>
    <section id="s-admin" hidden><h2>Amministrazione</h2><div class="grid" id="g-admin"></div></section>
    <div class="admin-bar">
      <span class="muted" id="adm-state">Ogni app chiede il suo accesso come sempre.</span>
      <button class="lnk" id="b-admin">🔒 Amministrazione</button>
    </div>
    <div class="foot"><span class="muted" id="upd-state"></span><button class="lnk" id="b-check">Controlla aggiornamenti</button></div>
    <p class="muted" id="install-hint">Installa l'HUB sul telefono: Android → Chrome → menu ⋮ → Installa app · iPhone → Safari → Condividi → Aggiungi alla schermata Home.</p>
  </div>
</div>

<div id="shell" hidden>
  <div class="topbar">
    <button id="b-back" aria-label="Torna all'HUB"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>HUB</button>
    <div class="t" id="t-name"></div>
    <button id="b-reload" aria-label="Ricarica"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button>
    <button id="b-ext" aria-label="Apri nel browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  </div>
  <div id="frames"></div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="apps.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

const ICONS={
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  shirt:'<path d="M9 3h6l5 3-2 4-2-1v12H8V9L6 10 4 6z"/>',
  book:'<path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5ZM8 7h8M8 11h6"/>',
  euro:'<path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9"/>',
  ledger:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',
  tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]||ICONS.book}</svg>`;
const APPS=window.HUB_APPS||[];
const isAdmin=()=>load("hub-admin")==="1";
let UPD_IDS=new Set();

/* ---------- home ---------- */
function tile(a){return `<button class="tile" data-id="${esc(a.id)}">${a.mode==="browser"?'<i class="ext">↗ browser</i>':""}${UPD_IDS.has(a.id)?'<i class="dot">Nuova versione</i>':""}<div class="ic">${svg(a.icon)}</div><b>${esc(a.name)}</b><span>${esc(a.sub)}</span></button>`}
function renderHome(){
  $("g-staff").innerHTML=APPS.filter(a=>a.area==="staff").map(tile).join("");
  const adm=isAdmin();
  $("s-admin").hidden=!adm;
  $("g-admin").innerHTML=adm?APPS.filter(a=>a.area==="admin").map(tile).join(""):"";
  $("b-admin").textContent=adm?"Esci da amministrazione":"🔒 Amministrazione";
  $("adm-state").innerHTML=adm?'<span class="pill">✓ Amministrazione attiva</span>':"Ogni app chiede il suo accesso come sempre.";
  document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>openApp(b.dataset.id,true));
  $("install-hint").hidden=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
}

/* ---------- sblocco amministrazione (PIN verificato sul server EffeOre) ---------- */
$("b-admin").onclick=()=>{
  if(isAdmin()){store("hub-admin",null);renderHome();return}
  $("dlgBody").innerHTML=`<h3>Amministrazione</h3><p class="muted" style="margin:0">Inserisci il PIN amministrazione (lo stesso di EffeOre).</p>
    <input id="a-pin" type="password" inputmode="numeric" autocomplete="off"><div id="a-err" class="err" hidden></div>
    <div class="row"><button class="sec" id="a-no">Annulla</button><button class="primary" id="a-ok">Sblocca</button></div>`;
  $("dlg").showModal();setTimeout(()=>$("a-pin").focus(),50);
  $("a-no").onclick=()=>$("dlg").close();
  $("a-pin").onkeydown=e=>{if(e.key==="Enter")$("a-ok").click()};
  $("a-ok").onclick=async()=>{
    const b=$("a-ok");b.disabled=true;b.textContent="Verifico…";$("a-err").hidden=true;
    try{
      const r=await fetch(window.HUB_ADMIN_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({fn:"api_adminCheck",args:[$("a-pin").value.trim()]}),redirect:"follow",cache:"no-store"});
      const j=await r.json();
      if(j.ok&&j.data===true){store("hub-admin","1");$("dlg").close();renderHome()}
      else throw new Error("PIN amministrazione non valido.");
    }catch(e){$("a-err").textContent=/PIN/.test(e.message)?e.message:"Connessione non riuscita. Riprova.";$("a-err").hidden=false;b.disabled=false;b.textContent="Sblocca"}
  };
};

/* ---------- apertura app dentro l'HUB ---------- */
const frames={};let cur=null;
function openApp(id,push){
  const a=APPS.find(x=>x.id===id);if(!a)return;
  if(a.area==="admin"&&!isAdmin())return;
  if(a.mode==="browser"){window.open(a.url,"_blank","noopener");return}
  cur=a;$("t-name").textContent=a.name;
  Object.values(frames).forEach(f=>f.hidden=true);
  if(!frames[id]){
    const f=document.createElement("iframe");
    f.src=a.url;f.title=a.name;f.allow="camera; clipboard-write; fullscreen";
    $("frames").appendChild(f);frames[id]=f;
  }else frames[id].hidden=false;
  $("home").hidden=true;$("shell").hidden=false;
  if(push)history.pushState({app:id},"","?app="+encodeURIComponent(id));
}
function goHome(push){
  $("shell").hidden=true;$("home").hidden=false;cur=null;
  if(push)history.pushState({},"",location.pathname);
}
$("b-back").onclick=()=>{if(history.state&&history.state.app)history.back();else goHome(true)};
$("b-reload").onclick=()=>{if(cur&&frames[cur.id])frames[cur.id].src=cur.url};
$("b-ext").onclick=()=>{if(cur)window.open(cur.url,"_blank","noopener")};
window.onpopstate=e=>{const id=e.state&&e.state.app;if(id)openApp(id,false);else goHome(false)};

/* ---------- aggiornamenti: HUB e app con versione in cache (EffeOre, Merch) ---------- */
// Ogni app ha la sua versione nel proprio sw.js (const CACHE = '...'). Se quella online è diversa
// da quella salvata sul telefono, l'app ha un aggiornamento: il tasto aggiorna solo quelle.
const SOURCES=[
  {key:"hub",name:"HUB",url:new URL("./",location.href).href,prefix:"hub-"},
  {key:"effeore",name:"EffeOre",url:"https://andreadamo.github.io/effeore/",prefix:"effeore-"},
  {key:"merch",name:"Merch",url:"https://andreadamo.github.io/effestudio-merch/",prefix:"merch-"}
].filter(x=>new URL(x.url).origin===location.origin);
const appsOf=src=>APPS.filter(a=>new URL(a.url,location.href).href.startsWith(src.url)).map(a=>a.id);
let pending=[],hubReady=false,lastCheck=0,busy=false;
const hadSW="serviceWorker" in navigator&&!!navigator.serviceWorker.controller;
async function onlineVer(src){
  const t=await fetch(src.url+"sw.js",{cache:"no-store"}).then(r=>r.ok?r.text():"");
  return (t.match(/const CACHE\s*=\s*'([^']+)'/)||[])[1]||"";
}
async function checkUpdates(force){
  if(busy||!("caches" in window)||!("serviceWorker" in navigator))return;
  if(!force&&Date.now()-lastCheck<60000)return;lastCheck=Date.now();
  if(force)$("upd-state").textContent="Controllo…";
  const keys=await caches.keys().catch(()=>[]);
  const res=await Promise.all(SOURCES.map(async src=>{
    try{const v=await onlineVer(src);if(!v)return null;
      const mine=keys.filter(k=>k.startsWith(src.prefix));
      return mine.length&&!mine.includes(v)?Object.assign({ver:v},src):null}catch(e){return null}
  }));
  pending=res.filter(Boolean);renderUpd();
}
function renderUpd(){
  const names=pending.map(p=>p.name);if(hubReady&&!names.includes("HUB"))names.unshift("HUB");
  UPD_IDS=new Set(pending.flatMap(appsOf));
  $("upd").hidden=!names.length;
  $("upd-t").textContent=names.length===1?"Aggiornamento disponibile":"Aggiornamenti disponibili";
  $("upd-s").textContent=names.join(" · ");
  $("upd-state").textContent=names.length?"":"✓ Tutto aggiornato";
  renderHome();
}
async function doUpdate(){
  if(busy)return;busy=true;const b=$("b-upd");b.disabled=true;b.textContent="Aggiorno…";
  let reloadHub=hubReady;
  for(const p of pending){
    try{
      const reg=await navigator.serviceWorker.getRegistration(p.url);
      if(reg){await reg.update();for(let i=0;i<40&&!(await caches.has(p.ver));i++)await new Promise(z=>setTimeout(z,250))}
      // versione vecchia ancora in cache (o nessun service worker): la svuoto, l'app si ricarica dalla rete
      if(!(await caches.has(p.ver))){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith(p.prefix)).map(k=>caches.delete(k)))}
    }catch(e){}
    if(p.key==="hub")reloadHub=true;
    appsOf(p).forEach(id=>{if(frames[id]){frames[id].remove();delete frames[id]}});
  }
  if(reloadHub){location.reload();return}
  pending=[];busy=false;b.disabled=false;b.textContent="Aggiorna";renderUpd();preload();
}
$("b-upd").onclick=doUpdate;
$("b-check").onclick=()=>checkUpdates(true);

/* ---------- avvio ---------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW){hubReady=true;renderUpd()}});
}
renderHome();

/* ---------- velocità: risveglia i server Google e prepara le app più usate ---------- */
// I server Apps Script "dormono" dopo qualche minuto: un ping leggero all'apertura dell'HUB
// li sveglia mentre l'utente sceglie l'app, così la prima schermata arriva in 1-2 s invece di 5-15 s.
(function warm(){
  let last=0;try{last=+sessionStorage.getItem("hub-warm")||0}catch(e){}
  if(Date.now()-last<4*60*1000)return;
  try{sessionStorage.setItem("hub-warm",String(Date.now()))}catch(e){}
  const ping=(url,fn,args)=>fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({fn,args:args||[]}),redirect:"follow",keepalive:true}).catch(()=>{});
  (window.HUB_WARM||[]).forEach(w=>ping(w.url,w.fn,w.args));
})();
// Carica in sottofondo EffeOre e Merch Staff quando il telefono è libero: aprendole, sono già pronte.
function preload(){
  const slow=navigator.connection&&(navigator.connection.saveData||/2g/.test(navigator.connection.effectiveType||""));
  if(slow)return;
  ["effeore","merch-staff"].forEach(id=>{
    const a=APPS.find(x=>x.id===id);if(!a||frames[id])return;
    const f=document.createElement("iframe");f.src=a.url;f.title=a.name;f.hidden=true;f.loading="eager";
    f.allow="camera; clipboard-write; fullscreen";$("frames").appendChild(f);frames[id]=f;
  });
}
(window.requestIdleCallback||(cb=>setTimeout(cb,1500)))(preload,{timeout:3000});
setTimeout(()=>checkUpdates(true),2000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("home").hidden)checkUpdates(false)});

const start=new URLSearchParams(location.search).get("app");
if(start){history.replaceState({},"",location.pathname);history.pushState({app:start},"","?app="+encodeURIComponent(start));openApp(start,false)}
</script>
</body>
</html>
