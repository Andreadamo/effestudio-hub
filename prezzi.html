<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<title>Prezziario Effestudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#ececea; --fg:#141414; --muted:#5f5f5c; --line:#dcdcd8;
  --accent:#141414; --accent-fg:#ffffff; --gold:#8a6a3d; --gold-soft:#efe6d8;
  --crit:#b3261e; --crit-soft:#f8dcd9; --ok:#1f7a45; --ok-soft:#dcf0e3;
  --display:"Montserrat","Arial",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --r:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e0e0e; --surface:#191919; --surface-2:#232323; --fg:#f2f2f0; --muted:#a3a3a0; --line:#2e2e2e;
  --accent:#f2f2f0; --accent-fg:#141414; --gold:#d6b483; --gold-soft:#2e2619;
  --crit:#f07a70; --crit-soft:#3d1d1a; --ok:#5cc489; --ok-soft:#15301f; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--body)}
input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0}
h1{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
section{scroll-margin-top:70px}
section>h2{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
section>h2 small{font-family:var(--body);font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.card h3{font-size:15px;font-weight:700}
.card p{margin:6px 0 0;color:var(--muted);font-size:14px}
.rows{margin-top:10px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .l{font-weight:500}
.row .l small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.row .p{font-family:var(--display);font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.row .p small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px}
.row.block .l,.row.block .p{opacity:.55}
.row.block .p{text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.tag.no{background:var(--crit-soft);color:var(--crit)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
li{margin:3px 0}
.note{margin-top:8px;font-size:13px;color:var(--muted)}
.was{text-decoration:line-through;color:var(--muted);font-weight:500;margin-right:6px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
footer{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prezziario servizi</h1>
    <div class="sub">Uso interno staff · Cecina · Pisa · Rosignano</div>
  </header>

  <div class="search"><input id="q" type="search" placeholder="Cerca servizio (es. coppia, hyrox, nutrizione)" autocomplete="off"></div>
  <nav class="chips" id="chips"></nav>
  <main id="list"></main>
  <p class="empty" id="empty" hidden>Nessun servizio trovato.</p>
  <footer>Prezzi da listino ottobre 2026. In caso di dubbio chiedere all'amministrazione.</footer>
</div>

<script>
// Listino: modificare qui i prezzi. block:true = voce sospesa, non proporre.
const LISTINO = [
  { id:"classi", title:"Classi Effestudio", note:"Allenamento di gruppo · max 3 accessi a settimana",
    cards:[
      { name:"Abbonamenti classi", desc:"Programmazione personalizzata, supervisione trainer, community.",
        rows:[
          { l:"1 accesso a settimana", s:"+ programma di allenamento", p:"€ 39,00", u:"/mese" },
          { l:"2 PT + iscrizione", p:"€ 50,00" },
          { l:"Trimestrale", p:"€ 99,00", u:"/mese", block:true },
          { l:"Semestrale", p:"€ 89,00", u:"/mese" },
          { l:"Annuale", p:"€ 74,00", u:"/mese" }
        ] }
    ] },
  { id:"coaching", title:"Coaching online", note:"Programmazione personalizzata, ovunque",
    cards:[
      { name:"Coaching online Base", desc:"1 PT online o live ogni 8 settimane + programmazione in app. NON prevede check settimanale e video analisi.",
        rows:[ { l:"8 settimane", p:"€ 99,00" }, { l:"12 mesi", p:"€ 39,00", u:"/mese" } ] },
      { name:"Coaching online Completo", desc:"Supporto continuo, check settimanali, video analisi, programmazione personalizzata in app.",
        rows:[ { l:"8 settimane", p:"€ 160,00" }, { l:"12 mesi", p:"€ 60,00", u:"/mese" } ] }
    ] },
  { id:"pt", title:"Personal Training", note:"Singolo e 1to2 (coppia)",
    cards:[
      { name:"Pacchetto singolo",
        rows:[
          { l:"10 PT", s:"totale € 390,00", p:"€ 39,00", u:"/PT" },
          { l:"20 PT", s:"totale € 680,00", p:"€ 34,00", u:"/PT" },
          { l:"30 PT", s:"totale € 900,00", p:"€ 30,00", u:"/PT" }
        ] },
      { name:"Pacchetto di coppia (1to2)",
        rows:[
          { l:"10 lezioni", s:"totale € 290,00 a testa", p:"€ 29,00", u:"/testa" },
          { l:"20 lezioni", s:"totale € 480,00 a testa", p:"€ 24,00", u:"/testa" },
          { l:"30 lezioni", s:"totale € 600,00 a testa", p:"€ 20,00", u:"/testa" }
        ],
        foot:"Se uno dei due è assente, la lezione viene scalata a entrambi." }
    ] },
  { id:"addon", title:"Servizi add on", note:"Da aggiungere al percorso",
    cards:[
      { name:"Pacchetto ingresso classi", desc:"Ingressi extra per più flessibilità.",
        rows:[
          { l:"10 ingressi", s:"totale € 150,00", p:"€ 15,00", u:"/ingresso" },
          { l:"20 ingressi", s:"totale € 200,00", p:"€ 10,00", u:"/ingresso" }
        ] },
      { name:"Altri add on",
        rows:[
          { l:"Nutrizione", s:"Piano alimentare personalizzato", p:"€ 39,00", u:"/mese" },
          { l:"Running / Endurance program", s:"Resistenza e performance nella corsa", p:"€ 39,00", u:"/mese" },
          { l:"Conditioning athlete", s:"Capacità atletiche, resistenza, carico", p:"€ 25,00", u:"/mese" },
          { l:"Return to play athlete", s:"Rientro sicuro dopo infortunio", p:"€ 25,00", u:"/mese" }
        ] }
    ] },
  { id:"hyrox", title:"Hyrox Pro", note:"Preparazione gara · minimo 4 settimane",
    cards:[
      { name:"Hyrox Pro",
        rows:[
          { l:"Quota settimanale", s:"minimo 4 settimane", p:"€ 29,00", u:"/settimana" },
          { l:"Test iniziale corsa su tapis", s:"una tantum", p:"+ € 25,00" }
        ],
        list:["Accesso classi Hyrox Effestudio 1/settimana","Programma running con test iniziale corsa su tapis","Programma allenamento in palestra + conditioning Hyrox se necessario"] }
    ] },
  { id:"promo", title:"Pacchetti promo", note:"Più valore, più risultati",
    cards:[
      { name:"Promo combinate",
        rows:[
          { l:"Classi annuale + Nutrizione annuale", s:"risparmio € 14,00", p:"€ 99,00", was:"€ 113,00" },
          { l:"Coaching online + Nutrizione annuale", s:"risparmio € 14,00", p:"€ 85,00", was:"€ 99,00" },
          { l:"Hyrox: Classi annuale + Running program + 1 ingresso/settimana extra", p:"€ 113,00", was:"€ 113,00", tag:"1 ingresso omaggio" }
        ] }
    ] }
];

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

function rowHtml(r){
  return `<div class="row${r.block?" block":""}">
    <div class="l">${esc(r.l)}${r.block?'<span class="tag no">In blocco · non proporre</span>':""}${r.tag?`<span class="tag gold">${esc(r.tag)}</span>`:""}${r.s?`<small>${esc(r.s)}</small>`:""}</div>
    <div class="p">${r.was?`<span class="was">${esc(r.was)}</span>`:""}${esc(r.p)}${r.u?`<small>${esc(r.u)}</small>`:""}</div></div>`;
}
function cardHtml(c){
  return `<div class="card"><h3>${esc(c.name)}</h3>${c.desc?`<p>${esc(c.desc)}</p>`:""}
    <div class="rows">${c.rows.map(rowHtml).join("")}</div>
    ${c.list?`<ul>${c.list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${c.foot?`<div class="note">${esc(c.foot)}</div>`:""}</div>`;
}
function render(q){
  const n=norm(q).trim();
  let any=false;
  const html=LISTINO.map(sec=>{
    const cards=sec.cards.map(c=>{
      if(!n)return c;
      const head=norm([sec.title,sec.note,c.name,c.desc,(c.list||[]).join(" ")].join(" ")).includes(n);
      if(head)return c;
      const rows=c.rows.filter(r=>norm([r.l,r.s,r.tag].join(" ")).includes(n));
      return rows.length?{...c,rows}:null;
    }).filter(Boolean);
    if(!cards.length)return "";
    any=true;
    return `<section id="${sec.id}"><h2>${esc(sec.title)}<small>${esc(sec.note)}</small></h2>${cards.map(cardHtml).join("")}</section>`;
  }).join("");
  document.getElementById("list").innerHTML=html;
  document.getElementById("empty").hidden=any;
  document.getElementById("chips").hidden=!!n;
}
document.getElementById("chips").innerHTML=LISTINO.map(s=>`<a href="#${s.id}">${esc(s.title)}</a>`).join("");
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render("");
</script>
</body>
</html>
